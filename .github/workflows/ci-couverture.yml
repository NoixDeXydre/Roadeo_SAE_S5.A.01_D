name: Couverture api Java

# Déclenchement sur push vers main et integration
on:
  push:
    branches: [ main, api ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v3

      # Installer Java JDK 20
      - name: Setup JDK 20
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '20'

      # Générer les rapports qualité
      - name: Maven build and tests
        working-directory: roadeo_api
        run: mvn clean verify

      # Générer le rapport de couverture (JaCoCo)
      - name: Generate code coverage
        working-directory: roadeo_api
        run: mvn jacoco:report