name: Docker

# Déclenchement sur push vers main et integration
on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: load test
        run: echo "lancement des tests"

  docker-build-push:
    needs: build-test
    runs-on: ubuntu-latest
    
    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # Connecter Docker à GitHub Container Registry
      - name: Connexion docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Construire l'image Docker
      - name: Build Docker image
        run: "docker buildx build -t rando-api:latest roadeo_api/"