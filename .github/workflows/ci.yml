name: CI/CD Java + Docker

# Déclenchement sur push vers main et integration
on:
  push:
    branches: [ main, api ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v3

      # Installer Java JDK 25
      - name: Setup JDK 25
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '25'

      # Générer les rapports qualité
      - name: Maven build and tests
        run: mvn clean verify
        working-directory: roadeo_api 

      # Générer le rapport de couverture (JaCoCo)
      - name: Generate code coverage
        run: mvn jacoco:report

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # Connecter Docker à GitHub Container Registry
      - name: Log in to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Construire l'image Docker
      - name: Build Docker image
        run: |
          docker build -t my-api:latest .