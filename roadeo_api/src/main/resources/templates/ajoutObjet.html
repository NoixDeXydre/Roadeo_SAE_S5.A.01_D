<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajout objet dans le sac</title>
</head>
<body>
<div style="display: flex; gap: 30px;">

    <!-- Conteneur pour visualiser le sac actuel -->
    <div class="container" id="sac-container" style="flex: 1;">
        <!-- récapitulatif (poids total des objets/ poids max, kcal total/ kcal requis, prix -->
        <h2>Récapitulatif du sac</h2>
        <p id="poids-summary">Poids total / Poids max :
            <span th:text="${poidsTotal}"></span> kg /
            <span th:text="${poidsMax}"></span> kg
        </p>
        <p id="kcal-summary">Calories total / Calories requises :
            <span th:text="${caloriesTotal}"></span> kcal /
            <span th:text="${caloriesRequise}"></span> kcal
        </p>
        <p id="prix-summary">Prix total : <span th:text="${prixTotal}"></span> €</p>

        <!-- Tableau des objets -->
        <table id="sac-table">
            <thead>
            <tr>
                <th>Dénomination</th>
                <th>Poids</th>
                <th>Kcal</th>
                <th>Prix</th>
                <th>Priorité</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <!-- Les lignes seront générées dynamiquement avec une liste d'objet -->
            <tr th:each="objet : ${objetsSac}">
                <td th:text="${objet.denomination}"></td>
                <td th:text="${objet.masse} + ' kg'"></td>
                <td th:text="${objet.nutrition} + ' kcal'"></td>
                <td th:text="${objet.prix} + ' €'"></td>
                <td th:text="${objet.utilite}"></td>
                <td>
                    <form th:action="@{/sac/supprimer}" method="post">
                        <input type="hidden" th:value="${objet.id}" name="idObjet">
                        <button type="submit">Supprimer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Conteneur pour visualiser et ajouter les objets -->
    <div class="container" id="objets-container" style="flex: 1;">
        <h2>Ajouter un objet</h2>

        <!-- Sélection du type et de l'objet -->
        <div>
            <label for="type-objet">Type d'objet :</label>
            <select id="type-objet" onchange="window.location.href='/sac/selectionnerType?categorie=' + this.value">
                <option th:each="cat : ${typesObjets}" th:value="${cat}" th:text="${cat}"
                        th:selected="${cat == categorieSelectionne}"></option>
            </select>

            <label for="objet-select">Objet :</label>
            <select id="objet-select" onchange="window.location.href='/sac/selectionnerObjet?idProduit=' + this.value">
                <option th:each="p : ${objetsListe}" th:value="${p.id}" th:text="${p.nom}"></option>
            </select>
        </div>

        <!-- Présentation détaillée de l'objet -->
        <div th:each="objet : ${objetsDetail}" style="margin-top: 15px; border: 1px solid #ccc; padding: 10px;">
            <h3 th:text="${objet.denomination}"></h3>
            <p th:text="${objet.description}"></p>
            <div class="info-horizontal">
                <span>Poids :<span th:text="${objet.masse}"></span> kg</span>
                <span id="objet-kcal">Calories : <span th:text="${objet.nutrition}"></span> kcal</span>
                <span>Utilité :<span th:text="${objet.utilite}"></span></span>
                <span id="objet-prix">Prix : <span th:text="${objet.prix}"></span> €</span>
                <span id="objet-priorite">Priorité : <span th:text="${objet.utilite}"></span></span>
            </div>
            <form th:action="@{/sac/ajouter}" method="post">
                <input type="hidden" name="idObjet" th:value="${objetsDetail.id}">
                <button type="submit">Ajouter au sac</button>
            </form>
        </div>
    </div>

</div>

<!-- Valider la liste d'objets pour le nom du sac -->
<div class="container" style="margin-top: 30px;">
    <form th:action="@{/sac/valider}" method="post">
        <button type="submit" id="valider-sac-btn">Valider</button>
    </form>
</div>
</body>
